services:
  db:
    image: postgres:16
    container_name: bodegas_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - bodegas_db_data:/var/lib/postgresql/data
      - ./db/tests:/tests:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: postgres:16
    container_name: bodegas_migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
      - ./db/migrate_entrypoint.sh:/migrate_entrypoint.sh:ro
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APP_PASSWORD: ${APP_DB_PASSWORD}
      RO_PASSWORD: ${RO_DB_PASSWORD}
    entrypoint: ["/migrate_entrypoint.sh"]

  api:
    build: ./api
    container_name: bodegas_api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      API_PORT: ${API_PORT:-8000}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  front:
    image: nginx:alpine
    container_name: bodegas_front
    volumes:
      - ./front:/usr/share/nginx/html:ro
    ports:
      - "8080:80"

  seed:
    build: ./db/seed
    container_name: bodegas_seed
    profiles:
      - seed
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      SEED: ${SEED:-42}
    depends_on:
      db:
        condition: service_healthy

volumes:
  bodegas_db_data:
