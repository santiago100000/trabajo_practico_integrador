services:
  api:
    build: ./api
    container_name: bodegas_api
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: app_rw
      DB_PASSWORD: ${APP_DB_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      PORT: 8001
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get({host:'127.0.0.1',port:8001,path:'/salud',timeout:2000},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: bodegas_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - bodegas_db_data:/var/lib/postgresql/data
      - ./db/tests:/tests:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: postgres:16
    container_name: bodegas_migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
      - ./db/migrate_entrypoint.sh:/migrate_entrypoint.sh:ro
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APP_PASSWORD: ${APP_DB_PASSWORD}
      RO_PASSWORD: ${RO_DB_PASSWORD}
      OWNER_PASSWORD: ${OWNER_DB_PASSWORD}
    entrypoint: ["/migrate_entrypoint.sh"]

  seed:
    build: ./db/seed
    container_name: bodegas_seed
    profiles:
      - seed
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${OWNER_DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      SEED: ${SEED:-42}
      SEED_CLIENTES: ${SEED_CLIENTES:-20000}
      SEED_COMPROBANTES: ${SEED_COMPROBANTES:-150000}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  front:
    image: nginx:alpine
    container_name: bodegas_front
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./front:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  bodegas_db_data:
