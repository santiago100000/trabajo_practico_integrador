<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bodegas del Atuel — Clientes</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
</head>
<body>
  <header>
    <h1>👥 Clientes</h1>
    <div class="header-actions">
      <a href="index.html" class="btn btn-outline">← Volver</a>
    </div>
  </header>

  <div class="main">
    <div class="page-title">
      <span>👥</span> Gestión de Clientes
    </div>

    <div id="alert-area"></div>

    <!-- Formulario de alta de cliente -->
    <div class="card">
      <div class="card-header">
        <h2>➕ Alta de Cliente</h2>
      </div>
      <form id="form-cliente">
        <div class="form-grid">
          <div class="form-group">
            <label for="cli-tipo-cliente">Tipo de cliente</label>
            <select id="cli-tipo-cliente" required>
              <option value="socio">Socio</option>
              <option value="distribuidor">Distribuidor</option>
              <option value="exportador">Exportador</option>
            </select>
          </div>
          <div class="form-group">
            <label for="cli-nombre">Nombre / Razón Social</label>
            <input type="text" id="cli-nombre" required>
          </div>
          <div class="form-group">
            <label for="cli-tipo-doc">Tipo de documento</label>
            <select id="cli-tipo-doc" required>
              <option value="DNI">DNI</option>
              <option value="CUIT">CUIT</option>
              <option value="CUIL">CUIL</option>
              <option value="PASAPORTE">Pasaporte</option>
            </select>
          </div>
          <div class="form-group">
            <label for="cli-nro-doc">Número de documento</label>
            <input type="text" id="cli-nro-doc" required>
          </div>
          <div class="form-group">
            <label for="cli-direccion">Dirección</label>
            <input type="text" id="cli-direccion" required>
          </div>
          <div class="form-group">
            <label for="cli-id-localidad">ID de localidad</label>
            <input type="number" id="cli-id-localidad" required min="1">
          </div>
          <div class="form-group" style="display:none;">
            <label for="cli-fecha-alta">Fecha de alta</label>
            <input type="date" id="cli-fecha-alta" required>
          </div>
          <div class="form-group">
            <label for="cli-subtipo">Subtipo</label>
            <select id="cli-subtipo">
              <option value="socio">Socio</option>
              <option value="distribuidor">Distribuidor</option>
              <option value="exportador">Exportador</option>
            </select>
          </div>
          <div class="form-group">
            <label for="cli-email">Email</label>
            <input type="email" id="cli-email">
          </div>
          <div class="form-group">
            <label for="cli-telefono">Teléfono</label>
            <input type="tel" id="cli-telefono">
          </div>
          <div class="form-group">
            <label for="cli-zona-cobertura">Zona de cobertura (distribuidor)</label>
            <input type="text" id="cli-zona-cobertura">
          </div>
          <div class="form-group">
            <label for="cli-nro-habilitacion">Nro. habilitación (distribuidor)</label>
            <input type="text" id="cli-nro-habilitacion">
          </div>
          <div class="form-group">
            <label for="cli-pais-destino">País de destino (exportador)</label>
            <input type="text" id="cli-pais-destino">
          </div>
        </div>
        <div class="form-actions">
          <button type="button" id="btn-limpiar-cliente" class="btn btn-outline">Limpiar</button>
          <button type="submit" id="btn-guardar-cliente" class="btn btn-success">Crear Cliente</button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>Listado de Clientes</h2>
      </div>

      <div id="clientes-container">
        <!-- Se llena por JS -->
      </div>
    </div>
  </div>

  <script>
    (async () => {
      const alertArea = document.getElementById('alert-area');
      const clientesContainer = document.getElementById('clientes-container');

      function mostrarAlerta(tipo, mensaje) {
        alertArea.innerHTML = `<div class="alert alert-${tipo}">${mensaje}</div>`;
      }

      function tipoClienteLabel(tipo) {
        const map = { socio: 'Socio', distribuidor: 'Distribuidor', exportador: 'Exportador' };
        return map[tipo] || tipo;
      }

      async function cargarClientes() {
        try {
          const clientes = await API.listarClientes();
          renderizarClientes(clientes);
        } catch (err) {
          console.error(err);
          mostrarAlerta('error', `Error cargando clientes: ${err.mensaje || err.message}`);
        }
      }

      function renderizarClientes(clientes) {
        if (!clientes || clientes.length === 0) {
          clientesContainer.innerHTML = '<div class="empty-state"><h3>No hay clientes registrados</h3></div>';
          return;
        }

        const filas = clientes.map(c => {
          const esSocio = c.es_socio ? 'Sí' : 'No';
          const esDistribuidor = c.es_distribuidor ? 'Sí' : 'No';
          const esExportador = c.es_exportador ? 'Sí' : 'No';
          return `
            <tr>
              <td>${c.id_cliente}</td>
              <td><strong>${c.nombre_razon_social}</strong></td>
              <td>${tipoClienteLabel(c.tipo_cliente)}</td>
              <td>${c.tipo_doc} ${c.nro_doc}</td>
              <td>${c.descuento}%</td>
              <td>
                <span style="font-size:0.8rem;">Socio: ${esSocio}<br>Dist: ${esDistribuidor}<br>Exp: ${esExportador}</span>
              </td>
              <td>
                <button type="button" class="btn btn-danger btn-small" onclick="eliminarCliente(${c.id_cliente})">Eliminar</button>
              </td>
            </tr>
          `;
        }).join('');

        clientesContainer.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>ID</th><th>Nombre / Razón Social</th><th>Tipo</th><th>Documento</th><th>Descuento</th><th>Subtipos</th><th>Acciones</th>
              </tr>
            </thead>
            <tbody>${filas}</tbody>
          </table>
        `;
      }

      window.eliminarCliente = async function(id) {
        if (!confirm('¿Eliminar este cliente?')) return;
        try {
          await API.eliminarCliente(id);
          mostrarAlerta('success', 'Cliente eliminado correctamente.');
          cargarClientes();
        } catch (err) {
          mostrarAlerta('error', err.mensaje || err.message || 'Error eliminando cliente');
        }
      }

      // Formulario de alta de cliente
      const formCliente = document.getElementById('form-cliente');
      const btnLimpiarCliente = document.getElementById('btn-limpiar-cliente');

      // Establecer fecha de alta por defecto (hoy)
      const fechaHoy = new Date().toISOString().split('T')[0];
      document.getElementById('cli-fecha-alta').value = fechaHoy;

      btnLimpiarCliente.addEventListener('click', () => {
        formCliente.reset();
        document.getElementById('cli-fecha-alta').value = fechaHoy;
      });

      formCliente.addEventListener('submit', async (e) => {
        e.preventDefault();
        const tipoCliente = document.getElementById('cli-tipo-cliente').value;
        const subtipo = document.getElementById('cli-subtipo').value;

        const data = {
          tipo_cliente: tipoCliente,
          nombre_razon_social: document.getElementById('cli-nombre').value,
          tipo_doc: document.getElementById('cli-tipo-doc').value,
          nro_doc: document.getElementById('cli-nro-doc').value,
          direccion: document.getElementById('cli-direccion').value,
          id_localidad: parseInt(document.getElementById('cli-id-localidad').value),
          fecha_alta: document.getElementById('cli-fecha-alta').value,
          subtipo: subtipo,
          email: document.getElementById('cli-email').value || null,
          telefono: document.getElementById('cli-telefono').value || null,
        };

        if (subtipo === 'distribuidor') {
          data.zona_cobertura = document.getElementById('cli-zona-cobertura').value || null;
          data.nro_habilitacion = document.getElementById('cli-nro-habilitacion').value || null;
        }
        if (subtipo === 'exportador') {
          data.pais_destino = document.getElementById('cli-pais-destino').value || null;
        }

        try {
          await API.crearCliente(data);
          mostrarAlerta('success', 'Cliente creado correctamente.');
          formCliente.reset();
          cargarClientes();
        } catch (err) {
          mostrarAlerta('error', err.mensaje || err.message || 'Error creando cliente');
        }
      });

      cargarClientes();
    })();
  </script>
</body>
</html>
