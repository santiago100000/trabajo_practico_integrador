<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodegas del Atuel - Front</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <h1>Bodegas del Atuel</h1>
        <p>Gestión y distribución vitivinícola</p>
    </header>

    <main>
        <section id="estado">
            <h2>Estado de la API</h2>
            <div id="badge">Cargando...</div>
            <pre id="detalle"></pre>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        async function main() {
            const badge = document.getElementById("badge");
            const detalle = document.getElementById("detalle");
            try {
                const data = await api.getSalud();
                badge.textContent = `API: ${data.api} | DB: ${data.db}`;
                badge.className = data.db === "ok" ? "ok" : "error";
                detalle.textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                badge.textContent = "API: error";
                badge.className = "error";
                detalle.textContent = String(err);
            }
        }
        main();
    </script>
</body>
</html>
