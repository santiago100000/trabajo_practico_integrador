<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bodegas del Atuel — Vinos</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
</head>
<body>
  <header>
    <h1>Vinos</h1>
    <div class="header-actions">
      <a href="index.html" class="btn btn-outline">← Volver</a>
      <a href="alta-vino.html" class="btn btn-success">+ Nuevo Vino</a>
      <a href="ventas.html" class="btn btn-outline">Nueva Venta</a>
    </div>
  </header>

  <div class="main">
    <div class="page-title">
      <span>🍷</span> Catálogo de Vinos
    </div>

    <div id="alert-area"></div>

    <div class="card">
      <div class="card-header">
        <h2>Listado de Vinos</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: center;">
          <input type="text" id="filtro-nombre" placeholder="Buscar por nombre...">
          <select id="filtro-tipo">
            <option value="">Todos los tipos</option>
            <option value="tinto">Tinto</option>
            <option value="blanco">Blanco</option>
            <option value="rosado">Rosado</option>
            <option value="espumante">Espumante</option>
          </select>
          <select id="filtro-bodega">
            <option value="">Todas las bodegas</option>
            <!-- Se llena por JS -->
          </select>
          <select id="filtro-cepa">
            <option value="">Todas las cepas</option>
            <!-- Se llena por JS -->
          </select>
          <select id="filtro-anada">
            <option value="">Todas las añadas</option>
            <!-- Se llena por JS -->
          </select>
          <button id="btn-aplicar-filtros" class="btn btn-primary btn-small">Filtrar</button>
        </div>
      </div>

      <div id="vinos-container">
        <!-- Se llena por JS -->
      </div>

      <div class="pagination" id="paginacion-container">
        <button id="btn-pagina-anterior" class="pagination-btn">Anterior</button>
        <span id="label-pagina-actual" class="pagination-current">Página 1</span>
        <button id="btn-pagina-siguiente" class="pagination-btn">Siguiente</button>
      </div>
    </div>
  </div>

  <script>
    (async () => {
      const alertArea = document.getElementById('alert-area');
      const vinosContainer = document.getElementById('vinos-container');
      const filtroNombre = document.getElementById('filtro-nombre');
      const filtroTipo = document.getElementById('filtro-tipo');
      const filtroBodega = document.getElementById('filtro-bodega');
      const filtroCepa = document.getElementById('filtro-cepa');
      const filtroAnada = document.getElementById('filtro-anada');
      const btnAplicar = document.getElementById('btn-aplicar-filtros');

      let paginaActual = 1;
      let bodegasDisponibles = [];
      let cepasDisponibles = [];
      let anadasDisponibles = [];

      function mostrarAlerta(tipo, mensaje) {
        alertArea.innerHTML = `<div class="alert alert-${tipo}">${mensaje}</div>`;
      }

      async function verificarAPI() {
        const ok = await API.verificarConectividad();
        if (!ok) {
          mostrarAlerta('error', 'No se puede conectar con la API. Verificá que el servidor esté corriendo en http://localhost:8001');
          return false;
        }
        return true;
      }

      async function cargarFiltros() {
        try {
          // Obtener vinos para extraer valores únicos de filtros
          const vinos = await API.listarVinos({ limit: 1000 });
          if (vinos) {
            const bodegasSet = new Set();
            const anadasSet = new Set();
            vinos.forEach(v => {
              if (v.bodega) bodegasSet.add(v.bodega);
              if (v.anada) anadasSet.add(v.anada);
            });
            bodegasDisponibles = Array.from(bodegasSet).sort();
            anadasDisponibles = Array.from(anadasSet).sort().reverse();

            filtroBodega.innerHTML = '<option value="">Todas las bodegas</option>' +
              bodegasDisponibles.map(b => `<option value="${b}">${b}</option>`).join('');

            filtroAnada.innerHTML = '<option value="">Todas las añadas</option>' +
              anadasDisponibles.map(a => `<option value="${a}">${a}</option>`).join('');
          }

          // Cargar cepas
          try {
            const cepasResp = await fetch(`${CONFIG.API_BASE_URL}/cepa`);
            const cepas = await cepasResp.json();
            cepasDisponibles = cepas || [];
            filtroCepa.innerHTML = '<option value="">Todas las cepas</option>' +
              cepasDisponibles.map(c => `<option value="${c.id_cepa}">${c.nombre}</option>`).join('');
          } catch (e) {
            console.error('Error cargando cepas:', e);
          }
        } catch (err) {
          console.error(err);
          mostrarAlerta('error', `Error cargando filtros: ${API.formatearErrorParaUsuario(err)}`);
        }
      }

      async function cargarVinos() {
        const params = {
          page: paginaActual,
          limit: 10,
        };
        if (filtroNombre.value.trim()) params.nombre = filtroNombre.value.trim();
        if (filtroTipo.value) params.tipo = filtroTipo.value;
        if (filtroBodega.value) params.bodega = filtroBodega.value;
        if (filtroCepa.value) params.cepa = filtroCepa.value;
        if (filtroAnada.value) params.anada = parseInt(filtroAnada.value);

        try {
          const vinos = await API.listarVinos(params);
          renderizarVinos(vinos);
          actualizarPaginacion(vinos.length);
        } catch (err) {
          console.error(err);
          mostrarAlerta('error', `Error cargando vinos: ${API.formatearErrorParaUsuario(err)}`);
        }
      }

      function actualizarPaginacion(cantidad) {
        const btnAnt = document.getElementById('btn-pagina-anterior');
        const btnSig = document.getElementById('btn-pagina-siguiente');
        const lblPag = document.getElementById('label-pagina-actual');

        if (lblPag) lblPag.textContent = `Página ${paginaActual}`;
        if (btnAnt) btnAnt.disabled = paginaActual <= 1;
        if (btnSig) btnSig.disabled = cantidad < 10;
      }

      function paginaAnterior() {
        if (paginaActual > 1) {
          paginaActual--;
          cargarVinos();
        }
      }

      function paginaSiguiente() {
        paginaActual++;
        cargarVinos();
      }

      function renderizarVinos(vinos) {
        if (!vinos || vinos.length === 0) {
          vinosContainer.innerHTML = '<div class="empty-state"><h3>No se encontraron vinos</h3><p>Prueba con otros filtros o agrega un vino nuevo.</p></div>';
          return;
        }

        const filas = vinos.map(v => `
          <tr>
            <td>${v.cod_vino}</td>
            <td><strong>${v.nombre}</strong></td>
            <td><span style="text-transform:uppercase">${v.tipo}</span></td>
            <td>${v.anada}</td>
            <td>$${Number(v.precio).toLocaleString('es-AR', {minimumFractionDigits:2})}</td>
            <td>${v.stock_total || 0}</td>
            <td>
              <a href="alta-vino.html?vino=${v.cod_vino}" class="btn btn-small btn-primary">Editar</button>
            </td>
          </tr>
        `).join('');

        vinosContainer.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Código</th><th>Nombre</th><th>Tipo</th><th>Añada</th><th>Precio</th><th>Stock Total</th><th>Acción</th>
              </tr>
            </thead>
            <tbody>${filas}</tbody>
          </table>
        `;
      }

      btnAplicar.addEventListener('click', () => {
        paginaActual = 1;
        cargarVinos();
      });

      document.getElementById('btn-pagina-anterior').addEventListener('click', paginaAnterior);
      document.getElementById('btn-pagina-siguiente').addEventListener('click', paginaSiguiente);

      if (await verificarAPI()) {
        cargarFiltros();
        cargarVinos();
      }
    })();
  </script>
</body>
</html>
